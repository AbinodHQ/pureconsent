name: Check PureConsent
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:db
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: pureconsent_test_ci
